<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>자재 로케이션</title>
<style>
*{box-sizing:border-box;-webkit-box-sizing:border-box;}
html,body{margin:0;padding:0;background:#f3ede2;color:#2e2a24;font-family:sans-serif;font-size:16px;-webkit-text-size-adjust:none;}
#top{background:#fbf8f2;padding:8px 10px 6px;border-bottom:1px solid #ddd2bf;}
#q{width:100%;font-size:19px;padding:8px 10px;border:2px solid #9a6a3a;border-radius:6px;background:#fff;color:#2e2a24;-webkit-appearance:none;}
.flt{overflow:hidden;margin-top:6px;}
.flt select{float:left;width:32%;margin-right:2%;font-size:14px;height:32px;padding:0 4px;border:1px solid #cfc3ad;border-radius:5px;background:#fff;color:#2e2a24;}
.flt select.last{margin-right:0;}
.row2{overflow:hidden;margin-top:6px;}
.chk{float:left;font-size:13px;color:#5d5547;padding:6px 10px;border:1px solid #cfc3ad;border-radius:5px;background:#fff;margin-right:6px;}
.chk.on{background:#9a6a3a;border-color:#9a6a3a;color:#fff;}
.reset{float:right;font-size:13px;color:#9a6a3a;padding:6px 10px;border:1px solid #cfc3ad;border-radius:5px;background:#fbf8f2;}
#cnt{font-size:12px;color:#7a7264;margin-top:6px;}
#list .it{padding:9px 12px;border-bottom:1px solid #e4dacb;background:#fbf8f2;}
#list .it:active{background:#efe5d4;}
.code{font-family:monospace;font-weight:bold;font-size:17px;color:#2e2a24;}
.loc{float:right;font-family:monospace;font-weight:bold;color:#a0561f;font-size:17px;}
.nm{font-size:13px;color:#6f675a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tg{display:inline-block;font-size:11px;padding:1px 5px;border-radius:3px;background:#e9dfcd;color:#5d5547;margin-right:4px;}
.tg.ov{background:#f6d9c6;color:#8a3a10;}
.empty{padding:20px;text-align:center;color:#7a7264;}
#det{display:none;padding:10px 12px;}
.bar{overflow:hidden;margin-bottom:6px;}
.back{float:left;background:#e4d8c3;color:#2e2a24;border:0;border-radius:5px;padding:8px 14px;font-size:15px;}
.dcode{font-family:monospace;font-size:22px;font-weight:bold;margin-top:4px;}
.dnm{font-size:14px;color:#6f675a;margin:2px 0 8px;}
.pills{overflow:hidden;margin-bottom:8px;}
.pill{float:left;margin:0 6px 6px 0;padding:5px 9px;border-radius:5px;background:#fbf8f2;border:1px solid #ddd2bf;font-family:monospace;font-size:16px;}
.pill b{display:block;font-family:sans-serif;font-size:10px;color:#7a7264;font-weight:normal;}
.pill.p1{background:#a0561f;border-color:#a0561f;color:#fff;}
.pill.p1 b{color:#f7e3d3;}
.warn{background:#f6d9c6;color:#7d3410;padding:5px 8px;border-radius:5px;font-size:13px;margin-bottom:8px;}
table.kv{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:10px;background:#fbf8f2;}
table.kv td{padding:5px 6px;border-bottom:1px solid #e4dacb;vertical-align:top;}
table.kv td.k{color:#7a7264;width:34%;font-size:12px;}
.rt{font-size:13px;color:#6f675a;margin:4px 0;}
table.rk{border-collapse:separate;border-spacing:3px;margin:0 auto;}
table.rk td{width:28px;height:24px;text-align:center;font-size:11px;border-radius:3px;background:#fbf8f2;border:1px solid #e4dacb;color:#a39a8a;}
table.rk td.u{background:#dccfb8;border-color:#dccfb8;}
table.rk td.h1{background:#a0561f;border-color:#a0561f;color:#fff;font-weight:bold;}
table.rk td.h2{background:#cf8a55;border-color:#cf8a55;color:#fff;font-weight:bold;}
table.rk td.lb{background:transparent;border-color:transparent;color:#7a7264;font-weight:bold;}
</style>
</head>

    <span class="chk" id="fOver">초과보관만</span>

  <div id="cnt"></div>
</div>

    h.push('</tr></table>');
    return h.join('');
  }
  function show(idx){
    var a=A[idx]; lastY=window.pageYOffset||0;
    var p=[['1순위',a[6],'p1'],['2순위',a[7],''],['3순위',a[8],''],['추가',a[9],'']], h=[], k;
    h.push('<div class="bar"><button class="back" id="back">◀ 목록</button></div>');
    h.push('<div class="dcode">'+esc(a[0])+'</div><div class="dnm">'+esc(a[1])+' · '+esc(a[2])+'</div>');
    h.push('<div class="pills">');
    for(k=0;k<p.length;k++) if(p[k][1]) h.push('<div class="pill '+p[k][2]+'"><b>'+p[k][0]+'</b>'+esc(p[k][1])+'</div>');
    h.push('</div>');
    if(a[10]) h.push('<div class="warn">'+esc(a[10])+'</div>');
    var kv=[['구분',CT[idx]],['실 규격',a[3]],['Maker',a[4]],['차종',a[5]],['월소요량',num(a[12])],['재고(9/30)',num(a[13])],['기존 위치',a[11]]];
    h.push('<table class="kv">');
    for(k=0;k<kv.length;k++) h.push('<tr><td class="k">'+kv[k][0]+'</td><td>'+esc(kv[k][1]||'-')+'</td></tr>');
    h.push('</table>');
    h.push(rackHtml(a));
    det.innerHTML=h.join('');
    list.style.display='none'; $('top').style.display='none'; det.style.display='block'; window.scrollTo(0,0);
    $('back').onclick=back;
  }
  function back(){ det.style.display='none'; $('top').style.display='block'; list.style.display='block'; window.scrollTo(0,lastY); }
  list.onclick=function(e){
    e=e||window.event; var t=e.target||e.srcElement;
    while(t && t!==list && !(t.getAttribute && t.getAttribute('data-i'))) t=t.parentNode;
    if(t && t!==list) show(+t.getAttribute('data-i'));
  };
  q.oninput=q.onkeyup=function(e){
    if(e && e.keyCode===13){ var f=list.querySelector('.it'); if(f){ q.blur(); show(+f.getAttribute('data-i')); } return; }
    clearTimeout(timer); timer=setTimeout(search,150);
  };
  fRack.onchange=fCat.onchange=fCar.onchange=fMaker.onchange=search;
  fOver.onclick=function(){ overOnly=!overOnly; fOver.className=overOnly?'chk on':'chk'; search(); };
  fReset.onclick=function(){ q.value=''; fRack.value=''; fCat.value=''; fCar.value=''; fMaker.value=''; overOnly=false; fOver.className='chk'; search(); };
  search();
})();
</script>
